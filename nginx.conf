server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 带 content hash 的静态资源 - 永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html - 不缓存，确保更新立即生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 封面图 - 7天缓存
    location ~ ^/api/cover/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://sdvx-data-service:8000;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=604800";
    }

    # 谱面数据 - 1天缓存
    location ~ ^/api/chart/data/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://sdvx-data-service:8000;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "public, max-age=86400";
    }

    # 其他 API - 不缓存
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://sdvx-data-service:8000;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
